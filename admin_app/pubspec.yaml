name: sattvalife_admin
description: Sattvalife Yoga Admin Mobile App - Flutter
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # Networking
  dio: ^5.5.0+1
  retrofit: ^4.4.0
  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  # Local Storage
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.22
  path_provider: ^2.1.4
  path: ^1.9.0
  # Auth
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  # UI
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  flutter_slidable: ^3.1.0
  # QR/Barcode
  mobile_scanner: ^5.1.0
  # Notifications
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^18.0.0
  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.7
  # Permissions
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.2
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/lottie/