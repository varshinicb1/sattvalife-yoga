<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%">
  <defs>
    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB0" />
      <stop offset="25%" stop-color="#DDA136" />
      <stop offset="50%" stop-color="#FDF1B8" />
      <stop offset="75%" stop-color="#B87B14" />
      <stop offset="100%" stop-color="#845305" />
    </linearGradient>

    <!-- Highlight / Specular Shimmer -->
    <linearGradient id="shimmerGradient" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#FFF5D6" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#DDA136" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#7A4C03" stop-opacity="0.6" />
    </linearGradient>

    <!-- Deep Shadow Gradient for 3D Carved Effect -->
    <linearGradient id="shadowGold" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#734702" />
      <stop offset="50%" stop-color="#A56E13" />
      <stop offset="100%" stop-color="#462A00" />
    </linearGradient>

    <!-- Subtle Drop Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(0, 20)">
    <!-- Central Spearhead (Main Trishul Center) -->
    <!-- Left Facet of Central Blade -->
    <path d="M 400 50 
             C 388 150 365 260 372 370 
             L 400 380 Z" 
          fill="url(#goldGradient)" />

    <!-- Right Facet of Central Blade (Shaded for 3D Chiseled look) -->
    <path d="M 400 50 
             C 412 150 435 260 428 370 
             L 400 380 Z" 
          fill="url(#shadowGold)" />

    <!-- Central Ridge Spine Highlight -->
    <path d="M 400 55 L 400 378" 
          stroke="url(#shimmerGradient)" stroke-width="3" stroke-linecap="round" />

    <!-- Left Outer Horn / Prong -->
    <!-- Sweeps out from base collar (x=380, y=420), swells outwards to x=210, y=260, curves up to tip x=270, y=110 -->
    <path d="M 380 435 
             C 310 440 215 390 205 280 
             C 198 195 240 135 272 105
             C 274 103 277 106 276 110
             C 255 165 240 230 262 290
             C 285 350 340 385 385 395 
             Z" 
          fill="url(#goldGradient)" />

    <!-- Inner Highlight of Left Prong -->
    <path d="M 272 108 
             C 252 165 240 230 265 290 
             C 285 345 335 380 380 395" 
          stroke="url(#shimmerGradient)" stroke-width="2" fill="none" opacity="0.8" />

    <!-- Right Outer Horn / Prong (Mirrored) -->
    <path d="M 420 435 
             C 490 440 585 390 595 280 
             C 602 195 560 135 528 105
             C 526 103 523 106 524 110
             C 545 165 560 230 538 290
             C 515 350 460 385 415 395 
             Z" 
          fill="url(#shadowGold)" />

    <!-- Outer Highlight of Right Prong -->
    <path d="M 528 108 
             C 548 165 560 230 535 290 
             C 515 345 465 380 420 395" 
          stroke="url(#shimmerGradient)" stroke-width="2" fill="none" opacity="0.9" />

    <!-- Sacred Collar / Damru Central Knot (x=400, y=430) -->
    <!-- Lotus Petal Base Ornaments -->
    <path d="M 400 375 
             C 370 390 355 425 385 440 
             C 395 445 405 445 415 440 
             C 445 425 430 390 400 375 Z" 
          fill="url(#goldGradient)" stroke="#845305" stroke-width="1.5" />

    <!-- Ornamental Rings on Base -->
    <ellipse cx="400" cy="445" rx="35" ry="9" fill="url(#goldGradient)" stroke="#683F00" stroke-width="1.5" />
    <ellipse cx="400" cy="458" rx="28" ry="7" fill="url(#shadowGold)" />
    <ellipse cx="400" cy="470" rx="32" ry="8" fill="url(#goldGradient)" stroke="#683F00" stroke-width="1.5" />

    <!-- Sacred Shaft / Handle -->
    <path d="M 390 475 L 390 730 C 390 745 400 755 400 755 C 400 755 410 745 410 730 L 410 475 Z" 
          fill="url(#goldGradient)" />
    <!-- Shaft Highlight -->
    <path d="M 398 475 L 398 735" stroke="#FFFFFF" stroke-width="2" opacity="0.75" />
    <path d="M 406 475 L 406 735" stroke="#683F00" stroke-width="1.5" opacity="0.6" />

    <!-- Bottom Tapered Finial -->
    <path d="M 388 730 L 400 780 L 412 730 Z" fill="url(#goldGradient)" stroke="#683F00" stroke-width="1" />
    <circle cx="400" cy="786" r="6" fill="url(#shimmerGradient)" />
  </g>
</svg>