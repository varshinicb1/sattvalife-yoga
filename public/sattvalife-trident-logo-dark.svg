<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB0" />
      <stop offset="30%" stop-color="#DDA136" />
      <stop offset="55%" stop-color="#FDF1B8" />
      <stop offset="80%" stop-color="#B87B14" />
      <stop offset="100%" stop-color="#734702" />
    </linearGradient>
    <linearGradient id="shadowGold" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#734702" />
      <stop offset="50%" stop-color="#A56E13" />
      <stop offset="100%" stop-color="#462A00" />
    </linearGradient>
    <linearGradient id="shimmerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#DDA136" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#1D2B1B" rx="16" />

  <!-- Trident Icon (Centered Top) -->
  <g transform="translate(475, 45) scale(0.31)">
    <!-- Central Blade -->
    <path d="M 400 50 C 388 150 365 260 372 370 L 400 380 Z" fill="url(#goldGradient)" />
    <path d="M 400 50 C 412 150 435 260 428 370 L 400 380 Z" fill="url(#shadowGold)" />
    <path d="M 400 55 L 400 378" stroke="url(#shimmerGradient)" stroke-width="3" stroke-linecap="round" />

    <!-- Left Horn -->
    <path d="M 380 435 C 310 440 215 390 205 280 C 198 195 240 135 272 105 C 274 103 277 106 276 110 C 255 165 240 230 262 290 C 285 350 340 385 385 395 Z" fill="url(#goldGradient)" />
    <path d="M 272 108 C 252 165 240 230 265 290 C 285 345 335 380 380 395" stroke="url(#shimmerGradient)" stroke-width="2" fill="none" opacity="0.8" />

    <!-- Right Horn -->
    <path d="M 420 435 C 490 440 585 390 595 280 C 602 195 560 135 528 105 C 526 103 523 106 524 110 C 545 165 560 230 538 290 C 515 350 460 385 415 395 Z" fill="url(#shadowGold)" />
    <path d="M 528 108 C 548 165 560 230 535 290 C 515 345 465 380 420 395" stroke="url(#shimmerGradient)" stroke-width="2" fill="none" opacity="0.9" />

    <!-- Base & Rings -->
    <path d="M 400 375 C 370 390 355 425 385 440 C 395 445 405 445 415 440 C 445 425 430 390 400 375 Z" fill="url(#goldGradient)" />
    <ellipse cx="400" cy="445" rx="35" ry="9" fill="url(#goldGradient)" stroke="#683F00" stroke-width="1.5" />
    <ellipse cx="400" cy="458" rx="28" ry="7" fill="url(#shadowGold)" />
    <ellipse cx="400" cy="470" rx="32" ry="8" fill="url(#goldGradient)" stroke="#683F00" stroke-width="1.5" />

    <!-- Shaft & Finial -->
    <path d="M 390 475 L 390 730 C 390 745 400 755 400 755 C 400 755 410 745 410 730 L 410 475 Z" fill="url(#goldGradient)" />
    <path d="M 398 475 L 398 735" stroke="#FFFFFF" stroke-width="2" opacity="0.75" />
    <path d="M 388 730 L 400 780 L 412 730 Z" fill="url(#goldGradient)" stroke="#683F00" stroke-width="1" />
    <circle cx="400" cy="786" r="6" fill="url(#shimmerGradient)" />
  </g>

  <!-- Brand Typography -->
  <g text-anchor="middle">
    <!-- 'Sattvalife' in Classical Luxury Serif -->
    <text x="600" y="375" 
          font-family="'Playfair Display', 'Cormorant Garamond', 'Cinzel', Georgia, serif" 
          font-size="86" 
          font-weight="600" 
          letter-spacing="4" 
          fill="#FDFBF7">Sattvalife</text>

    <!-- Decorative Gold Divider Line with Diamond Center -->
    <g transform="translate(600, 420)">
      <line x1="-190" y1="0" x2="-25" y2="0" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.8" />
      <polygon points="0,-6 6,0 0,6 -6,0" fill="url(#goldGradient)" />
      <line x1="25" y1="0" x2="190" y2="0" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.8" />
    </g>

    <!-- 'YOGA & WELLNESS' in Spaced Geometric Sans-Serif -->
    <text x="600" y="475" 
          font-family="'Plus Jakarta Sans', 'Raleway', 'Montserrat', sans-serif" 
          font-size="24" 
          font-weight="500" 
          letter-spacing="16" 
          fill="#D4AF37">YOGA &amp; WELLNESS</text>

    <text x="600" y="525" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="14" 
          font-weight="400" 
          letter-spacing="6" 
          fill="#D4AF37" opacity="0.75">LEICESTER • EST. 2016</text>
  </g>
</svg>